<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087eae">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sistema Darkis</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:22px;display:grid;place-items:center;background:linear-gradient(155deg,#0784b8,#056f9f 58%,#004f78);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#173244}
    main{width:min(100%,520px);padding:28px 21px 22px;border:1px solid rgba(255,255,255,.58);border-radius:30px;background:#fffdf8;box-shadow:0 28px 80px rgba(0,30,47,.34)}
    .logo{display:block;width:190px;max-width:70%;height:auto;margin:0 auto 20px}
    .kicker{text-align:center;color:#f15a24;font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
    h1{margin:5px 0 7px;text-align:center;color:#713b28;font-size:28px}
    .copy{margin:0 0 19px;text-align:center;color:#718690;font-size:12px}
    nav{display:grid;gap:10px}
    .role{min-height:70px;padding:10px 13px;display:grid;grid-template-columns:48px minmax(0,1fr) 18px;align-items:center;gap:12px;border:1px solid #d7e5eb;border-radius:19px;color:#173244;background:#fff;box-shadow:0 7px 18px rgba(0,64,95,.07);text-align:left;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
    a.role:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,64,95,.14)}
    a.role:focus-visible{outline:3px solid #087eae;outline-offset:3px}
    .icon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;color:#fff;background:linear-gradient(145deg,#f15a24,#ff8258);font-size:21px}
    .icon.cat-icon{object-fit:contain;border-radius:0;background:none}
    .role:nth-child(2) .icon{background:linear-gradient(145deg,#087eae,#13a4d7)}
    .role:nth-child(3) .icon{background:linear-gradient(145deg,#713b28,#a96549)}
    strong{display:block;font-size:13px}
    small{display:block;margin-top:3px;color:#82949d;font-size:9px}
    .arrow{color:#91a3ac;font-size:25px}
    .disabled{opacity:.55;cursor:not-allowed}
    footer{margin-top:15px;text-align:center;color:#8b9ba3;font-size:9px}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Darkis Brownies">
    <div class="kicker">Sistema Darkis</div>
    <h1>¿Cómo vas a entrar?</h1>
    <p class="copy">Selecciona tu área para abrir las herramientas correspondientes.</p>
    <nav aria-label="Áreas de Darkis">
      <a class="role" href="reloj-checador.html"><img class="icon cat-icon" src="cat-icon.png" alt="" aria-hidden="true"><span><strong>Darkita</strong><small>Reloj checador, entradas y salidas</small></span><span class="arrow">›</span></a>
      <a class="role" href="repartidor.html"><span class="icon">⌖</span><span><strong>Repartidor</strong><small>Clientes, visitas, ventas y cambios</small></span><span class="arrow">›</span></a>
      <div class="role disabled" aria-disabled="true"><span class="icon">▥</span><span><strong>Administrador</strong><small>Disponible en una versión posterior</small></span><span class="arrow">—</span></div>
    </nav>
    <footer>Darkis Brownies · Todo el negocio en un solo lugar</footer>
  </main>
  <script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
